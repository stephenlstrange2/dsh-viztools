name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v1.x tag to publish
        required: true
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/verify-release.mjs --tag "${{ github.event.release.tag_name || inputs.tag }}" --dsh 0.2.0-rc.2
      - run: pnpm publish --provenance --access public --no-git-checks
